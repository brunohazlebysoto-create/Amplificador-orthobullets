pende fuertemente de la edad al momento de la cirugia, siendo mejor cuando se realiza antes de las 8 semanas de vida. <a class=\"cita\" href=\"https://pubmed.ncbi.nlm.nih.gov/00000021/\" target=\"_blank\" rel=\"noopener\">00000021</a> <span class=\"agregado\" title=\"Contenido agregado, no proviene del topic base\">+</span> Un subgrupo de pacientes requiere trasplante hepatico en la evolucion independiente del exito inicial de la cirugia.</p>\n<h2>Que se agrego</h2>\n<ul>\n<li><span class=\"agregado\" title=\"Contenido agregado, no proviene del topic base\">+</span> Toda la ficha es contenido agregado, dado que no existe topic base de Orthobullets para este tema.</li>\n</ul>\n<p><strong>Declaracion de cobertura:</strong> sin base de Orthobullets — ficha construida integramente desde literatura (ilustrativa en este ejemplo).</p>"}, {"slug": "fractura-supracondilea-de-humero-ejemplo", "tema": "Fractura supracondilea de humero [EJEMPLO]", "categoria": ["Pediatria ortopedica", "Trauma", "Extremidad superior"], "version": 1, "actualizado": "2026-08-05T13:44:20", "creado": "2026-08-05T13:44:20", "procedencia": "ejemplo, sin verificacion", "modelo": "claude-code (skill ficha-medica-orthobullets)", "numReferencias": 2, "citasInexistentes": 0, "citasNoVerificables": 1, "agregados": 2, "html": "<h1>Fractura supracondilea de humero [EJEMPLO]</h1>\n<p><strong>FICHA DE EJEMPLO — contenido de demostracion para probar el visualizador web.</strong> Citas ilustrativas, no verificadas. No usar para estudio ni practica clinica. Esta ficha incluye a proposito una cita que no aparece en su archivo de referencias, para mostrar como el visualizador marca las citas sin verificar.</p>\n<p><strong>Fecha de elaboracion:</strong> 5 de agosto de 2026\n<strong>Cobertura:</strong> ejemplo, sin verificacion de citas</p>\n<h2>Resumen</h2>\n<p>Es la fractura de codo mas frecuente en la edad pediatrica, con pico entre los 5 y 7 anios. <a class=\"cita\" href=\"https://pubmed.ncbi.nlm.nih.gov/00000010/\" target=\"_blank\" rel=\"noopener\">00000010</a> La clasificacion de Gartland guia la decision terapeutica segun el desplazamiento. El riesgo principal es la lesion neurovascular asociada, que debe buscarse dirigidamente en el examen inicial. <a class=\"cita\" href=\"https://pubmed.ncbi.nlm.nih.gov/00000011/\" target=\"_blank\" rel=\"noopener\">00000011</a></p>\n<h2>Clasificacion</h2>\n<table>\n<thead>\n<tr>\n<th>Tipo</th>\n<th>Criterio</th>\n<th>Conducta</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>I</td>\n<td>Sin desplazamiento</td>\n<td>Inmovilizacion</td>\n</tr>\n<tr>\n<td>II</td>\n<td>Angulacion con cortical posterior intacta</td>\n<td>Reduccion +/- fijacion</td>\n</tr>\n<tr>\n<td>III</td>\n<td>Desplazamiento completo</td>\n<td>Reduccion cerrada y fijacion percutanea</td>\n</tr>\n</tbody>\n</table>\n<h2>Complicaciones</h2>\n<p><strong>Lesion nerviosa.</strong> El nervio interoseo anterior es el mas frecuentemente comprometido en fracturas tipo III con desplazamiento posterolateral. <a class=\"cita\" href=\"https://pubmed.ncbi.nlm.nih.gov/99999999/\" target=\"_blank\" rel=\"noopener\">99999999</a> <span class=\"agregado\" title=\"Contenido agregado, no proviene del topic base\">+</span> La mayoria recupera funcion de forma espontanea dentro de los primeros meses.</p>\n<h2>Que se agrego</h2>\n<ul>\n<li><span class=\"agregado\" title=\"Contenido agregado, no proviene del topic base\">+</span> Nota sobre recuperacion espontanea de la lesion nerviosa — dato ilustrativo. [sin referencia disponible]</li>\n</ul>\n<p><strong>Declaracion de cobertura:</strong> ficha de ejemplo; la cita <a class=\"cita\" href=\"https://pubmed.ncbi.nlm.nih.gov/99999999/\" target=\"_blank\" rel=\"noopener\">99999999</a> es deliberadamente invalida para demostrar el chequeo de integridad del catalogo.</p>"}, {"slug": "pie-equino-varo-congenito-ejemplo", "tema": "Pie equino varo congenito [EJEMPLO]", "categoria": ["Pediatria ortopedica", "Pie y tobillo"], "version": 1, "actualizado": "2026-08-05T13:43:27", "creado": "2026-08-05T13:43:27", "procedencia": "ejemplo, sin verificacion", "modelo": "claude-code (skill ficha-medica-orthobullets)", "numReferencias": 3, "citasInexistentes": 0, "citasNoVerificables": 0, "agregados": 2, "html": "<h1>Pie equino varo congenito [EJEMPLO]</h1>\n<p><strong>FICHA DE EJEMPLO — contenido de demostracion para probar el visualizador web.</strong> No fue generada por el pipeline real (busqueda en PubMed y Orthobullets bloqueada en este entorno de prueba), sus citas son ilustrativas y no estan verificadas. No usar para estudio ni practica clinica.</p>\n<p><strong>Fecha de elaboracion:</strong> 5 de agosto de 2026\n<strong>Topic base:</strong> Orthobullets — identificado (pediatrics/4062) pero no descargado en esta corrida de prueba\n<strong>Cobertura:</strong> ejemplo, sin verificacion de citas\n<strong>Auditoria Gemini:</strong> no configurada</p>\n<h2>Resumen</h2>\n<p>El pie equino varo congenito es una deformidad tridimensional del pie presente al nacer, caracterizada por equino de tobillo, varo de retropie, aduccion de mediopie y cavo. <a class=\"cita\" href=\"https://pubmed.ncbi.nlm.nih.gov/00000001/\" target=\"_blank\" rel=\"noopener\">00000001</a> El diagnostico es clinico, sin necesidad de imagenes en el periodo neonatal. El tratamiento de primera linea es el metodo de Ponseti con yesos seriados y tenotomia percutanea del tendon de Aquiles, reservando la cirugia extensa para casos resistentes. <a class=\"cita\" href=\"https://pubmed.ncbi.nlm.nih.gov/00000002/\" target=\"_blank\" rel=\"noopener\">00000002</a></p>\n<h2>Epidemiologia</h2>\n<p>La incidencia reportada es de aproximadamente 1 en 1000 recien nacidos vivos, con variacion segun poblacion y con predominio en sexo masculino. <a class=\"cita\" href=\"https://pubmed.ncbi.nlm.nih.gov/00000001/\" target=\"_blank\" rel=\"noopener\">00000001</a> <span class=\"agregado\" title=\"Contenido agregado, no proviene del topic base\">+</span> La proporcion bilateral se estima cercana al 50% de los casos.</p>\n<h2>Clasificacion</h2>\n<table>\n<thead>\n<tr>\n<th>Sistema</th>\n<th>Criterio definitorio</th>\n<th>Implicancia terapeutica</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Pirani</td>\n<td>6 componentes clinicos puntuados 0, 0.5 o 1</td>\n<td>Puntaje mayor predice mas yesos necesarios</td>\n</tr>\n<tr>\n<td>Dimeglio</td>\n<td>4 parametros angulares mas 4 factores agravantes</td>\n<td>Guia severidad y pronostico de rigidez</td>\n</tr>\n</tbody>\n</table>\n<h2>Tratamiento</h2>\n<p><strong>NO OPERATORIO — Metodo de Ponseti.</strong> Indicado como primera linea en la gran mayoria de los casos, iniciado idealmente en las primeras semanas de vida. <a class=\"cita\" href=\"https://pubmed.ncbi.nlm.nih.gov/00000002/\" target=\"_blank\" rel=\"noopener\">00000002</a> Consiste en manipulacion y yeso seriado semanal, seguido de tenotomia percutanea del tendon de Aquiles en la mayoria de los pacientes y ferulizacion de mantenimiento prolongada.</p>\n<p><strong>OPERATORIO — liberacion posteromedial.</strong> Reservada para casos resistentes al yeso o con recidiva no manejable con manipulacion y ferula. <a class=\"cita\" href=\"https://pubmed.ncbi.nlm.nih.gov/00000003/\" target=\"_blank\" rel=\"noopener\">00000003</a></p>\n<h2>Que se agrego</h2>\n<ul>\n<li><span class=\"agregado\" title=\"Contenido agregado, no proviene del topic base\">+</span> Nota sobre proporcion de casos bilaterales — dato ilustrativo, no verificado. [sin referencia disponible]</li>\n</ul>\n<p><strong>Declaracion de cobertura:</strong> ficha de ejemplo generada manualmente para probar el visualizador; no siguio el flujo completo del skill por restriccion de red en el entorno de prueba.</p>"}];

function agrupar(fichas){
  const raiz = {};
  for(const f of fichas){
    let nodo = raiz;
    const ruta = f.categoria && f.categoria.length ? f.categoria : ["Sin categoria"];
    for(const nivel of ruta){
      nodo.hijos = nodo.hijos || {};
      nodo.hijos[nivel] = nodo.hijos[nivel] || {};
      nodo = nodo.hijos[nivel];
    }
    nodo.temas = nodo.temas || [];
    nodo.temas.push(f);
  }
  return raiz;
}

function pintarNodo(nodo, contenedor, filtro){
  if(nodo.temas){
    const temas = nodo.temas
      .filter(f => !filtro || f.tema.toLowerCase().includes(filtro))
      .sort((a,b) => a.tema.localeCompare(b.tema));
    for(const f of temas){
      const a = document.createElement("a");
      a.href = "#" + f.slug;
      a.className = "tree__item";
      a.dataset.slug = f.slug;
      a.innerHTML = f.tema + '<span class="ver">v' + f.version + ' &middot; ' + f.actualizado.slice(0,10) + '</span>';
      a.addEventListener("click", (e) => { e.preventDefault(); mostrar(f.slug); });
      contenedor.appendChild(a);
    }
  }
  if(nodo.hijos){
    for(const clave of Object.keys(nodo.hijos).sort()){
      const hijo = nodo.hijos[clave];
      const tieneCoincidencia = filtro ? contieneCoincidencia(hijo, filtro) : true;
      if(!tieneCoincidencia) continue;
      const grupo = document.createElement("div");
      grupo.className = "tree__group";
      const etiqueta = document.createElement("div");
      etiqueta.className = "tree__label";
      etiqueta.textContent = clave;
      const hijos = document.createElement("div");
      hijos.className = "tree__children";
      grupo.appendChild(etiqueta);
      grupo.appendChild(hijos);
      contenedor.appendChild(grupo);
      pintarNodo(hijo, hijos, filtro);
    }
  }
}

function contieneCoincidencia(nodo, filtro){
  if(nodo.temas && nodo.temas.some(f => f.tema.toLowerCase().includes(filtro))) return true;
  if(nodo.hijos) return Object.values(nodo.hijos).some(h => contieneCoincidencia(h, filtro));
  return false;
}

function repintarArbol(){
  const filtro = document.getElementById("buscador").value.trim().toLowerCase();
  const cont = document.getElementById("arbol");
  cont.innerHTML = "";
  pintarNodo(agrupar(FICHAS), cont, filtro);
  const activo = document.querySelector(".tree__item.active");
  if(!activo && filtro === "") return;
}

function chip(texto, variante){
  return '<span class="chip' + (variante ? ' chip--' + variante : '') + '">' + texto + '</span>';
}

function mostrar(slug){
  const f = FICHAS.find(x => x.slug === slug);
  const cont = document.getElementById("contenido");
  if(!f){
    cont.innerHTML = '<div class="empty">Ficha no encontrada.</div>';
    return;
  }
  document.querySelectorAll(".tree__item").forEach(el => el.classList.toggle("active", el.dataset.slug === slug));

  const chips = [];
  chips.push(chip((f.categoria && f.categoria.length ? f.categoria.join(" / ") : "Sin categoria")));
  chips.push(chip("v" + f.version + " &middot; " + f.actualizado.slice(0,10)));
  chips.push(chip(f.numReferencias + " referencias", "amber"));
  if(f.citasInexistentes > 0){
    chips.push(chip(f.citasInexistentes + " PMID inexistentes", "warn"));
  } else if(f.citasNoVerificables > 0){
    chips.push(chip(f.citasNoVerificables + " PMID sin verificar (sin red)", "amber"));
  } else {
    chips.push(chip("citas verificadas", "good"));
  }
  if(f.agregados > 0) chips.push(chip(f.agregados + " aportes [+]"));

  cont.innerHTML =
    '<div class="chips">' + chips.join("") + '</div>' +
    '<article>' + f.html + '</article>';
  window.location.hash = slug;
  window.scrollTo(0,0);
  cont.scrollTop = 0;
}

document.getElementById("buscador").addEventListener("input", repintarArbol);
repintarArbol();

const inicial = window.location.hash.replace("#", "");
if(inicial && FICHAS.some(f => f.slug === inicial)){
  mostrar(inicial);
} else if(FICHAS.length){
  document.getElementById("contenido").innerHTML =
    '<div class="empty">Elige un tema del panel izquierdo para verlo aqui.</div>';
} else {
  document.getElementById("contenido").innerHTML =
    '<div class="empty">El catalogo todavia no tiene fichas. Genera una con '
    + '<code>python -m amplificador generar</code> o el skill '
    + '<code>/ficha-medica-orthobullets</code>, despues corre '
    + '<code>python -m amplificador exportar-web</code> de nuevo.</div>';
}
</script>
